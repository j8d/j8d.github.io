<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>J8D · Small web projects</title>
    <meta name="description" content="A directory of Ryan's small, useful web projects." />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://j8d.org/" />
    <style>
      :root {
        --bg: #f7f7f4;
        --surface: #ffffff;
        --text: #1c1f1e;
        --muted: #4f5653;
        --border: #d6d9d5;
        --accent: #1d5e52;
        --focus: #1a56c4;
        --radius: 12px;
        --space: 1rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141716;
          --surface: #1d2120;
          --text: #eceeed;
          --muted: #b3bab7;
          --border: #343a38;
          --accent: #7fd1bf;
          --focus: #8ab4ff;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 40rem;
        margin: 0 auto;
        padding: calc(var(--space) * 4) calc(var(--space) * 1.25) calc(var(--space) * 3);
      }

      h1 {
        margin: 0;
        font-size: 2.5rem;
        line-height: 1.1;
        letter-spacing: 0.04em;
      }

      .intro {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: 1.125rem;
      }

      h2 {
        margin: calc(var(--space) * 3) 0 var(--space);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .projects {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: var(--space);
      }

      .card {
        display: block;
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: inherit;
        text-decoration: none;
        transition: border-color 150ms ease;
      }

      .card:hover {
        border-color: var(--accent);
      }

      .card-title {
        display: block;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--accent);
      }

      .card:hover .card-title {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .card-desc {
        display: block;
        margin-top: 0.375rem;
        color: var(--muted);
      }

      footer {
        margin-top: calc(var(--space) * 3);
        padding-top: var(--space);
        border-top: 1px solid var(--border);
        color: var(--muted);
      }

      footer a {
        color: var(--accent);
        text-underline-offset: 0.2em;
        /* Keeps the inline link a comfortable touch target. */
        display: inline-block;
        padding: 0.5rem 0;
      }

      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
        border-radius: 4px;
      }

      .card:focus-visible {
        border-radius: var(--radius);
      }

      @media (max-width: 30rem) {
        .page {
          padding-top: calc(var(--space) * 2.5);
        }

        h1 {
          font-size: 2rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>J8D</h1>
        <p class="intro">Small, useful web projects by Ryan.</p>
      </header>

      <main>
        <h2 id="projects-heading">Projects</h2>
        <ul class="projects" aria-labelledby="projects-heading">
          <li>
            <a class="card" href="/nc-trout-stocking/">
              <span class="card-title">NC Trout Stocking Map</span>
              <span class="card-desc">
                Interactive map of North Carolina delayed-harvest trout waters, with stocking
                dates, county filters and a searchable schedule.
              </span>
            </a>
          </li>
        </ul>
      </main>

      <footer>
        <a href="https://github.com/j8d">Source on GitHub</a>
      </footer>
    </div>
  </body>
</html>
